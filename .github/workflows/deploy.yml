name: Deploy to Production (Example)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      override_by:
        description: "Engineer overriding the sleep gate"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Secrets can't be read in `if:` conditions, so expose it via env.
      REVERIE_URL: ${{ secrets.REVERIE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Skip sleep gate (not configured)
        if: env.REVERIE_URL == ''
        run: echo "::notice title=Sleep gate skipped::REVERIE_URL secret is not set; deploying without the Reverie sleep gate."

      - name: Check sleep gate
        if: env.REVERIE_URL != ''
        uses: ./
        with:
          reverie_url: ${{ env.REVERIE_URL }}
          reverie_token: ${{ secrets.REVERIE_API_TOKEN }}
          engineer: ${{ vars.REVERIE_ENGINEER }}
          override_by: ${{ github.event.inputs.override_by }}

      - name: Deploy
        run: echo "Deploying to production..."
