name: "Reverie Sleep Gate"
description: "Block production deploys when the engineer is in deep sleep or REM"
inputs:
  reverie_url:
    description: "URL of the Reverie service"
    required: true
  reverie_token:
    description: "Shared API token for the Reverie service (REVERIE_API_TOKEN)"
    required: true
  engineer:
    description: "Engineer identifier"
    required: true
  override_by:
    description: "Engineer overriding the sleep gate (optional)"
    required: false
    default: ""
outputs:
  allowed:
    description: '"true" if the deploy may proceed, otherwise "false" (blocked or error)'
    value: ${{ steps.gate.outputs.allowed }}
  sleep_state:
    description: "Sleep stage reported by the service (awake, light, deep, rem), or unknown"
    value: ${{ steps.gate.outputs.sleep_state }}
runs:
  using: "composite"
  steps:
    - name: Check sleep gate
      id: gate
      shell: bash
      env:
        INPUT_REVERIE_URL: ${{ inputs.reverie_url }}
        INPUT_REVERIE_TOKEN: ${{ inputs.reverie_token }}
        INPUT_ENGINEER: ${{ inputs.engineer }}
        INPUT_OVERRIDE_BY: ${{ inputs.override_by }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: node "${{ github.action_path }}/src/github/action.ts"
